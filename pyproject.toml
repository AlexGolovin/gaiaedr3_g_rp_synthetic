[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gaiaedr3_g_rp_synthetic"
version = "1.2.0"
authors = [
  { name="Alex Golovin", email="agolovin@lsw.uni-heidelberg.de"}

]
description = "Calculates synthetic (deblended) G-RP for datasets from Gaia DR3 using BP-RP photometry."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# Explicitly listing dependencies guarantees users have what they need
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "astropy>=5.0",
]

[project.urls]
"Homepage" = "https://github.com/AlexGolovin/gaiaedr3_g_rp_synthetic"
"Bug Tracker" = "https://github.com/AlexGolovin/gaiaedr3_g_rp_synthetic/issues"

[tool.setuptools]
# Tells setuptools to install the single .py file as a module
py-modules = ["gaiaedr3_g_rp_synthetic"]
